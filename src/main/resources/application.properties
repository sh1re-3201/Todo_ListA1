spring.application.name=Todo_List-A1

# Default: in-memory H2 (data resets on restart). See D3.
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Dev: always revalidate static files so phones don't show a stale app.js (D18)
spring.web.resources.cache.cachecontrol.no-cache=true
